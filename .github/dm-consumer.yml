## AI-Assisted

## Per-repo parameters for developer-meta-files consumer workflows, read at
## workflow runtime. Here: extra apt packages the dist-ai test suites need.
coverity:
  ## scan.coverity.com project name (org-ai-assisted-owned; the "/" is
  ## rejected in manual registration so the name is slash-free).
  project-name:    "org-ai-assisted-sdwdate-gui"
  canonical-repos: "org-ai-assisted/sdwdate-gui"

dist-ai-tests:
  ## Subject import deps absent from debian:trixie-slim: sdwdate_gui_client
  ## imports pyinotify; sdwdate_gui_shared imports schema; the coverage suite
  ## needs python3-coverage (FATAL, never skipped, if missing).
  apt-packages: "python3 python3-pytest python3-hypothesis python3-pyqt5 python3-pyinotify python3-schema python3-coverage"
  ## sdwdate_gui_server imports sanitize_string and sdwdate_gui_shared imports
  ## strict_config_parser, both shipped by helper-scripts (no apt package).
  helper-scripts: true
